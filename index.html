<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CantinApp - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <img src="assets/simbolofacul.png" alt="Símbolo da Faculdade" class="logo-img">
                <h1>🍽️ CantinApp</h1>
                <p>Sistema de Pedidos da Cantina</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="ra">RA (Registro do Aluno)</label>
                    <input type="text" id="ra" name="ra" placeholder="Digite seu RA" required>
                    <small>Exemplo: 2024001</small>
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
                </div>

                <button type="submit" class="btn btn-primary">Entrar</button>
            </form>

            <div class="login-info">
                <p><strong>Dados de teste:</strong></p>
                <p>RA: 2024001 | Senha: senha123</p>
                <p>RA: 2024002 | Senha: senha123</p>
                <p>RA: 9999999 | Senha: admin123 (Administrador)</p>
            </div>

            <div id="loginError" class="error-message" style="display: none;"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
