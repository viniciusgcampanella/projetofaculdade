<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CantinApp - Histórico de Pedidos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <div class="header-left">
                    <button class="menu-hamburger" id="menuToggle" onclick="toggleMenu()">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                    <img src="img/simbolofacul.png" alt="Símbolo da Faculdade" class="campus-logo">
                    <h1>🍽️ CantinApp</h1>
                </div>
                <div class="user-info">
                    <span id="nomeAluno"></span>
                    <button class="btn btn-secondary" onclick="logout()">Sair</button>
                </div>
            </div>
        </header>

        <nav class="nav-menu" id="navMenu">
            <a href="cardapio.html" class="nav-link">🍕 Cardápio</a>
            <a href="historico.html" class="nav-link active">📋 Histórico</a>
            <a href="relatorio.html" class="nav-link">📊 Relatório</a>
        </nav>

        <main class="main-content historico-page">
            <section class="historico-section">
                <div class="section-header">
                    <h2>Histórico de Pedidos</h2>
                    <div class="filtros">
                        <select id="filtroStatus" class="filtro-select">
                            <option value="">Todos os status</option>
                            <option value="Confirmado">Confirmado</option>
                            <option value="Retirado">Retirado</option>
                            <option value="Cancelado">Cancelado</option>
                        </select>
                    </div>
                </div>

                <div id="historicoPedidos" class="pedidos-list">
                    <p class="vazio">Nenhum pedido encontrado</p>
                </div>
            </section>
        </main>
    </div>

    <div id="modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close" onclick="fecharModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            verificarAutenticacao();
            carregarHistorico();
            document.getElementById('filtroStatus').addEventListener('change', carregarHistorico);
        });
    </script>
</body>
</html>
